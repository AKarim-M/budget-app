<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#2d6a4f">
  <meta name="description" content="Household budget: how much is left to spend, with the card bill always covered.">
  <title>Household Budget</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="banner" class="banner" hidden></div>
  <header id="glance" class="glance"></header>

  <main id="main">
    <section id="tab-home" class="tab" role="tabpanel" aria-labelledby="t-home"></section>
    <section id="tab-plan" class="tab" role="tabpanel" aria-labelledby="t-plan" hidden></section>
    <section id="tab-spending" class="tab" role="tabpanel" aria-labelledby="t-spending" hidden></section>
    <section id="tab-settings" class="tab" role="tabpanel" aria-labelledby="t-settings" hidden></section>
    <section id="wizard" class="wizard" hidden></section>
  </main>

  <nav id="tabbar" class="tabbar" aria-label="Sections">
    <a id="t-home" href="#home" data-route="home"><span class="tab-icon" aria-hidden="true">🏠</span>Home</a>
    <a id="t-plan" href="#plan" data-route="plan"><span class="tab-icon" aria-hidden="true">📅</span>Plan</a>
    <a id="t-spending" href="#spending" data-route="spending"><span class="tab-icon" aria-hidden="true">📊</span>Spending</a>
    <a id="t-settings" href="#settings" data-route="settings"><span class="tab-icon" aria-hidden="true">⚙️</span>Settings</a>
  </nav>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript">This app needs JavaScript turned on.</p></noscript>
</body>
</html>
